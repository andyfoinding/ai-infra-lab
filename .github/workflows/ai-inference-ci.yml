name: AI Inference CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-inference/requirements.txt
          pip install pytest httpx

      - name: Run API tests
        working-directory: apps/ai-inference
        run: |
          python -m pytest tests/test_app.py -v

      - name: Build Docker image
        run: |
          docker build \
            -t ai-inference:ci \
            apps/ai-inference

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ai-inference:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true