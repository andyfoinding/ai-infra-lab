name: AI Inference CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-inference/**"
      - ".github/workflows/ai-inference-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "apps/ai-inference/**"
      - ".github/workflows/ai-inference-ci.yml"

  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, Build and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-inference/requirements.txt
          pip install pytest httpx

      - name: Run API tests
        working-directory: apps/ai-inference
        run: |
          python -m pytest tests/test_app.py -v

      - name: Build Docker image
        run: |
          docker build \
            -t ai-inference:ci \
            apps/ai-inference

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ai-inference:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # ==========================================
      # MANUAL DEPLOYMENT ONLY
      # ==========================================

      - name: Authenticate to Google Cloud
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/398574054377/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@ai-infra-lab-2026.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Tag and push Docker image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="us-east1-docker.pkg.dev/ai-infra-lab-2026/ai-infra-images/ai-inference"

          docker tag ai-inference:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="us-east1-docker.pkg.dev/ai-infra-lab-2026/ai-infra-images/ai-inference"

          gcloud run deploy ai-inference \
            --image="$IMAGE:${GITHUB_SHA}" \
            --region=us-east1 \
            --project=ai-infra-lab-2026 \
            --platform=managed \
            --port=8000 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=1 \
            --cpu-throttling \
            --no-allow-unauthenticated \
            --quiet