name: GPU Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "terraform/gpu-vm/**"
      - "scripts/gpu/**"
      - ".github/workflows/gpu-infrastructure.yml"

  pull_request:
    branches: [main]
    paths:
      - "terraform/gpu-vm/**"
      - "scripts/gpu/**"
      - ".github/workflows/gpu-infrastructure.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate GPU Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform/gpu-vm
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/gpu-vm
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/gpu-vm
        run: terraform validate

      - name: Validate GPU Shell Scripts
        run: |
          for script in scripts/gpu/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done