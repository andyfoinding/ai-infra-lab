name: AI RAG CI

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-rag/**"
      - ".github/workflows/ai-rag-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push RAG Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/398574054377/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@ai-infra-lab-2026.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RAG image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ai-rag
          file: ./apps/ai-rag/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            us-east1-docker.pkg.dev/ai-infra-lab-2026/ai-infra-images/ai-rag-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
